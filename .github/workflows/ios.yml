name: Unsigned iOS archive

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
        continue-on-error: true

      - name: Show Xcode
        run: |
          xcodebuild -version
          ls /Applications | grep -i Xcode || true

      - name: Discover project and scheme
        id: probe
        run: |
          set -euo pipefail
          xcodebuild -list
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, subprocess, glob
          projs = glob.glob("*.xcodeproj")
          if not projs:
              raise SystemExit("no .xcodeproj in repo root")
          proj = projs[0]
          raw = subprocess.check_output(["xcodebuild", "-list", "-project", proj, "-json"], text=True)
          data = json.loads(raw)
          schemes = data.get("project", {}).get("schemes") or data.get("workspace", {}).get("schemes") or []
          print("project=" + proj)
          scheme = next((s for s in schemes if "Test" not in s and "UITest" not in s), None)
          if not scheme and schemes:
              scheme = schemes[0]
          if not scheme:
              raise SystemExit("no scheme from xcodebuild -list")
          print("scheme=" + scheme)
          print("discovered schemes:", schemes, file=__import__("sys").stderr)
          PY

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "${{ steps.probe.outputs.project }}" \
            -scheme "${{ steps.probe.outputs.scheme }}" || true

      - name: Archive without signing
        run: |
          set -euo pipefail
          PROJ="${{ steps.probe.outputs.project }}"
          SCHEME="${{ steps.probe.outputs.scheme }}"
          echo "Archiving $PROJ scheme $SCHEME"
          xcodebuild archive \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Zip archive
        run: |
          ditto -c -k --sequesterRsrc --keepParent App.xcarchive App.xcarchive.zip
          ls -lh App.xcarchive.zip

      - uses: actions/upload-artifact@v4
        with:
          name: App.xcarchive.zip
          path: App.xcarchive.zip
          if-no-files-found: error
          retention-days: 7
